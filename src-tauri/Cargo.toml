[package]
name = "timetracker-app"
description = "GUI driver: Tauri commands, tray, global hotkey, autostart, clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "timetracker_app_lib"

[[bin]]
name = "timetracker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tt-app.workspace = true
tt-core.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-autostart = "2.7"
tauri-plugin-clipboard-manager = "2.5"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"

[dev-dependencies]
tt-core = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
